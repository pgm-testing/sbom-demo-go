name: Verify processed Atlas submission
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Submission ID from the baseline evidence
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify original submission
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: python3 check.py atlas --submission-id "$SUBMISSION_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-verification-${{ github.run_id }}
          path: evidence/
